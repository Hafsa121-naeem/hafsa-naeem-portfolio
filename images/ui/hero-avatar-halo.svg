<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Radiant Halo Background Gradient -->
    <radialGradient id="haloBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="60%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </radialGradient>

    <!-- Glowing Ring Filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="laptopLidHalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
  </defs>

  <!-- Luminous Outer Aura Ring -->
  <circle cx="200" cy="200" r="190" stroke="#3B82F6" stroke-width="6" opacity="0.4" filter="url(#auraGlow)"/>
  <circle cx="200" cy="200" r="188" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Clipped Inner Artwork -->
  <g clip-path="url(#circleClip)">
    <!-- Base background -->
    <rect width="400" height="400" fill="url(#haloBg)"/>

    <!-- Subtle Dot Grid in Background -->
    <g opacity="0.3">
      <circle cx="80" cy="100" r="2.5" fill="#2563EB"/>
      <circle cx="100" cy="100" r="2.5" fill="#2563EB"/>
      <circle cx="120" cy="100" r="2.5" fill="#2563EB"/>
      <circle cx="80" cy="120" r="2.5" fill="#2563EB"/>
      <circle cx="100" cy="120" r="2.5" fill="#2563EB"/>
      <circle cx="120" cy="120" r="2.5" fill="#2563EB"/>
      <circle cx="280" cy="90" r="2.5" fill="#2563EB"/>
      <circle cx="300" cy="90" r="2.5" fill="#2563EB"/>
      <circle cx="320" cy="90" r="2.5" fill="#2563EB"/>
      <circle cx="280" cy="110" r="2.5" fill="#2563EB"/>
      <circle cx="300" cy="110" r="2.5" fill="#2563EB"/>
      <circle cx="320" cy="110" r="2.5" fill="#2563EB"/>
    </g>

    <!-- Botanical Leaves Left & Right -->
    <path d="M50 320 C 60 250, 90 200, 110 150" stroke="#2563EB" stroke-width="2.5" opacity="0.7"/>
    <path d="M70 240 C 45 230, 35 200, 45 180 C 65 190, 80 220, 70 240 Z" fill="#3B82F6" opacity="0.75"/>
    <path d="M90 200 C 65 190, 60 160, 75 145 C 92 155, 100 185, 90 200 Z" fill="#60A5FA" opacity="0.8"/>

    <path d="M350 320 C 330 240, 310 180, 290 120" stroke="#1D4ED8" stroke-width="2.5" opacity="0.8"/>
    <path d="M330 220 C 355 210, 365 180, 355 160 C 335 170, 320 200, 330 220 Z" fill="#2563EB" opacity="0.8"/>
    <path d="M310 170 C 335 160, 340 130, 325 115 C 308 125, 300 155, 310 170 Z" fill="#3B82F6" opacity="0.85"/>

    <!-- Desk Surface Line -->
    <ellipse cx="200" cy="330" rx="170" ry="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Laptop Base Shadow -->
    <ellipse cx="200" cy="318" rx="110" ry="10" fill="#0F172A" opacity="0.25"/>

    <!-- Laptop Base Deck -->
    <polygon points="110,314 290,314 300,320 100,320" fill="#475569"/>
    <polygon points="100,320 300,320 294,324 106,324" fill="#334155"/>
    <rect x="188" y="319" width="24" height="2" rx="1" fill="#94A3B8"/>

    <!-- Laptop Lid angled open (viewed from back) -->
    <polygon points="120,165 280,165 292,314 108,314" fill="url(#laptopLidHalo)" stroke="#475569" stroke-width="1.5"/>
    <!-- Lid inner sheen -->
    <polygon points="130,175 270,175 280,306 120,306" fill="#1E293B" opacity="0.4"/>

    <!-- Glowing Code Symbol </ > -->
    <g filter="url(#auraGlow)">
      <text x="200" y="250" font-family="'JetBrains Mono', Consolas, monospace" font-size="32" font-weight="800" fill="#60A5FA" text-anchor="middle" letter-spacing="3">&lt;/&gt;</text>
    </g>
    <text x="200" y="250" font-family="'JetBrains Mono', Consolas, monospace" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">&lt;/&gt;</text>

    <!-- Ceramic Pen Holder on Right -->
    <ellipse cx="305" cy="318" rx="18" ry="5" fill="#0F172A" opacity="0.18"/>
    <rect x="296" y="255" width="3" height="55" rx="1.5" fill="#64748B" transform="rotate(-6 296 255)"/>
    <rect x="306" y="250" width="3" height="60" rx="1.5" fill="#1E293B"/>
    <rect x="314" y="256" width="3" height="54" rx="1.5" fill="#2563EB" transform="rotate(8 314 256)"/>
    <rect x="292" y="280" width="26" height="38" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Stacked Books on Left -->
    <ellipse cx="95" cy="318" rx="28" ry="6" fill="#0F172A" opacity="0.15"/>
    <rect x="75" y="306" width="46" height="9" rx="1.5" fill="#1E3A8A"/>
    <rect x="78" y="308" width="40" height="5" fill="#F8FAFC"/>
    <rect x="78" y="297" width="40" height="9" rx="1.5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="80" y="299" width="36" height="5" fill="#F1F5F9"/>
    <line x1="80" y1="297" x2="80" y2="306" stroke="#2563EB" stroke-width="2"/>
  </g>

  <!-- Glowing Rim Overlay -->
  <circle cx="200" cy="200" r="185" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.9"/>
  <circle cx="200" cy="200" r="183" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
