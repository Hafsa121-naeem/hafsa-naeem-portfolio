<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bldgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bldgWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Pavement / ground -->
  <path d="M10 145 L190 145 C195 145, 195 152, 190 152 L10 152 C5 152, 5 145, 10 145 Z" fill="#E2E8F0"/>
  <!-- Street line -->
  <line x1="20" y1="149" x2="180" y2="149" stroke="#94A3B8" stroke-dasharray="8 6" stroke-width="1.5"/>

  <!-- Left building wing (Recessed) -->
  <polygon points="25,65 55,50 55,145 25,145" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Windows left wing -->
  <rect x="30" y="70" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>
  <rect x="42" y="70" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>
  <rect x="30" y="90" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>
  <rect x="42" y="90" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>
  <rect x="30" y="110" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>
  <rect x="42" y="110" width="8" height="12" rx="1" fill="#93C5FD" opacity="0.8"/>

  <!-- Center-Left mid building -->
  <polygon points="55,42 95,28 95,145 55,145" fill="url(#bldgWall)" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="62" y="48" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="78" y="48" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="62" y="72" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="78" y="72" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="62" y="96" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="78" y="96" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="62" y="120" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>
  <rect x="78" y="120" width="10" height="15" rx="1.5" fill="#3B82F6" opacity="0.85"/>

  <!-- Main Corporate Tower (Right Foreground) -->
  <polygon points="95,15 160,10 160,145 95,145" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Tower shadow facade -->
  <polygon points="160,10 185,25 185,145 160,145" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>

  <!-- Tower Windows Grid -->
  <!-- Floor 4 -->
  <rect x="105" y="24" width="14" height="18" rx="2" fill="#1D4ED8"/>
  <rect x="125" y="24" width="14" height="18" rx="2" fill="#1D4ED8"/>
  <rect x="145" y="24" width="10" height="18" rx="2" fill="#1D4ED8"/>

  <!-- Floor 3 -->
  <rect x="105" y="50" width="14" height="18" rx="2" fill="#2563EB"/>
  <rect x="125" y="50" width="14" height="18" rx="2" fill="#2563EB"/>
  <rect x="145" y="50" width="10" height="18" rx="2" fill="#2563EB"/>

  <!-- Floor 2 -->
  <rect x="105" y="76" width="14" height="18" rx="2" fill="#3B82F6"/>
  <rect x="125" y="76" width="14" height="18" rx="2" fill="#3B82F6"/>
  <rect x="145" y="76" width="10" height="18" rx="2" fill="#3B82F6"/>

  <!-- Floor 1 -->
  <rect x="105" y="102" width="14" height="18" rx="2" fill="#60A5FA"/>
  <rect x="125" y="102" width="14" height="18" rx="2" fill="#60A5FA"/>
  <rect x="145" y="102" width="10" height="18" rx="2" fill="#60A5FA"/>

  <!-- Glass Entrance Canopy -->
  <polygon points="110,132 145,132 150,145 105,145" fill="#0F172A" opacity="0.8"/>
  <rect x="118" y="132" width="18" height="13" fill="#60A5FA" opacity="0.9"/>

  <!-- Right Facade side windows -->
  <polygon points="165,35 178,42 178,54 165,47" fill="#64748B" opacity="0.6"/>
  <polygon points="165,60 178,67 178,79 165,72" fill="#64748B" opacity="0.6"/>
  <polygon points="165,85 178,92 178,104 165,97" fill="#64748B" opacity="0.6"/>
  <polygon points="165,110 178,117 178,129 165,122" fill="#64748B" opacity="0.6"/>

  <!-- Small landscaping trees in front -->
  <ellipse cx="40" cy="142" rx="6" ry="10" fill="#2563EB" opacity="0.7"/>
  <ellipse cx="70" cy="142" rx="7" ry="11" fill="#1D4ED8" opacity="0.75"/>
  <ellipse cx="175" cy="142" rx="8" ry="12" fill="#1E40AF" opacity="0.8"/>
</svg>
