<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="laptopBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="tableGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow for whole desk scene -->
  <ellipse cx="270" cy="340" rx="230" ry="24" fill="#0F172A" opacity="0.08"/>

  <!-- Polished Desk Surface -->
  <path d="M40 330 L500 330 C520 330, 535 342, 530 355 L510 365 C500 372, 480 375, 460 375 L80 375 C60 375, 40 372, 30 365 L10 355 C5 342, 20 330, 40 330 Z" fill="url(#tableGlow)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ================= LAPTOP (Center Left) ================= -->
  <!-- Laptop base shadow -->
  <ellipse cx="230" cy="336" rx="145" ry="12" fill="#0F172A" opacity="0.22"/>

  <!-- Laptop Base (Lower chassis) -->
  <polygon points="120,332 340,332 355,338 105,338" fill="#475569"/>
  <polygon points="105,338 355,338 348,342 112,342" fill="#334155"/>
  <!-- Front lip notch -->
  <rect x="215" y="337" width="30" height="2" rx="1" fill="#94A3B8"/>

  <!-- Laptop Lid (Angled open, viewed from back) -->
  <polygon points="135,145 325,145 340,332 120,332" fill="url(#laptopLid)" stroke="#475569" stroke-width="1.5"/>

  <!-- Inner sheen reflection line on lid -->
  <polygon points="145,155 315,155 326,325 134,325" fill="#1E293B" opacity="0.4"/>

  <!-- Glowing Code Symbol </ > on lid -->
  <g filter="url(#softGlow)">
    <text x="230" y="248" font-family="'JetBrains Mono', Consolas, monospace" font-size="34" font-weight="800" fill="#60A5FA" text-anchor="middle" letter-spacing="4">&lt;/&gt;</text>
  </g>
  <text x="230" y="248" font-family="'JetBrains Mono', Consolas, monospace" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">&lt;/&gt;</text>

  <!-- ================= PEN HOLDER (Center Right) ================= -->
  <!-- Pen holder shadow -->
  <ellipse cx="385" cy="336" rx="28" ry="8" fill="#0F172A" opacity="0.18"/>

  <!-- Pens and stylus sticking out -->
  <!-- Stylus 1 (Dark) -->
  <rect x="372" y="200" width="4" height="75" rx="2" fill="#1E293B" transform="rotate(-8 372 200)"/>
  <!-- Stylus 2 (Silver tip) -->
  <rect x="382" y="190" width="5" height="85" rx="2.5" fill="#64748B"/>
  <rect x="383" y="185" width="3" height="6" rx="1" fill="#0284C7"/>
  <!-- Stylus 3 (Angled right) -->
  <rect x="394" y="202" width="4" height="72" rx="2" fill="#334155" transform="rotate(10 394 202)"/>

  <!-- Ceramic Pen Cup -->
  <rect x="364" y="250" width="42" height="78" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <ellipse cx="385" cy="250" rx="21" ry="5" fill="#E2E8F0"/>
  <ellipse cx="385" cy="327" rx="20" ry="4" fill="#E2E8F0" opacity="0.5"/>

  <!-- ================= STACKED NOTEBOOKS / BOOKS (Far Right) ================= -->
  <!-- Bottom Book Shadow -->
  <ellipse cx="445" cy="338" rx="45" ry="8" fill="#0F172A" opacity="0.15"/>

  <!-- Bottom Book (Navy Hardcover) -->
  <rect x="408" y="318" width="76" height="15" rx="2" fill="url(#bookCover)"/>
  <rect x="412" y="321" width="70" height="9" fill="#F8FAFC"/>
  <!-- Ribbon marker -->
  <path d="M470 326 C475 330, 482 334, 488 335" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Book (White/Azure Hardcover) -->
  <rect x="414" y="303" width="70" height="15" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="418" y="306" width="64" height="9" fill="#F1F5F9"/>
  <!-- Book spine accent line -->
  <line x1="418" y1="303" x2="418" y2="318" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Small delicate succulent / plant pot behind books -->
  <ellipse cx="452" cy="292" rx="12" ry="3" fill="#0F172A" opacity="0.12"/>
  <polygon points="444,282 460,282 458,294 446,294" fill="#E2E8F0" stroke="#CBD5E1"/>
  <!-- Plant leaf -->
  <path d="M452 282 C446 270, 442 262, 445 258 C452 262, 452 274, 452 282 Z" fill="#2563EB" opacity="0.8"/>
  <path d="M452 282 C458 270, 464 262, 460 258 C454 262, 452 274, 452 282 Z" fill="#3B82F6" opacity="0.7"/>

  <!-- Dot Grid Subtle Pattern (Top Right) -->
  <g opacity="0.35">
    <circle cx="270" cy="90" r="2.5" fill="#3B82F6"/>
    <circle cx="285" cy="90" r="2.5" fill="#3B82F6"/>
    <circle cx="300" cy="90" r="2.5" fill="#3B82F6"/>
    <circle cx="315" cy="90" r="2.5" fill="#3B82F6"/>
    <circle cx="270" cy="105" r="2.5" fill="#3B82F6"/>
    <circle cx="285" cy="105" r="2.5" fill="#3B82F6"/>
    <circle cx="300" cy="105" r="2.5" fill="#3B82F6"/>
    <circle cx="315" cy="105" r="2.5" fill="#3B82F6"/>
    <circle cx="270" cy="120" r="2.5" fill="#3B82F6"/>
    <circle cx="285" cy="120" r="2.5" fill="#3B82F6"/>
    <circle cx="300" cy="120" r="2.5" fill="#3B82F6"/>
    <circle cx="315" cy="120" r="2.5" fill="#3B82F6"/>
  </g>
</svg>
